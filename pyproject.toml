[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "calculadora-algebra"
version = "0.1.0"
description = "Calculadora de algebra linear em Python com funcoes reutilizaveis e CLI."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Projeto Calculadora Algebrica" }]

[project.optional-dependencies]
notebook = ["numpy>=1.23", "ipython>=8"]
test = ["pytest>=8"]

[project.scripts]
calculadora-algebra = "calculadora_algebra.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
